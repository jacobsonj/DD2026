<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Link to the react library from unpkg.com -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Link to the Babel library from unpkg.com -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>

    <!-- Import bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Important React concepts: Components, Props, State -->
    <div id="app" class="container"></div>
    <script type="text/babel">
        const fruits = ["Apple", "Banana", "Cherry", "Mango", "Pineapple"];

        const app = document.getElementById("app");
        // React Components
        function Header({ title }) {
            return <h1> {createTitle(title)} </h1>;
        }
        function Paragraph(props) {
            return <p>{props.text}</p>;
        }
        function createTitle(title) {
            if (title) {
                return title;
            } else {
                return "Default title";
            }
        }

        function Results({ result, data, onNextPage, onPreviousPage }) {

            return (
                <div>
                    {result.length > 0 && (
                        <>
                            <h2>Search Results:</h2>
                            <p>
                                Showing page {data?.currentPage} of {data?.lastPage} total pages
                            </p>
                            <p>
                                Total results: {data?.hits}
                            </p>
                            <button className="btn btn-secondary" onClick={onPreviousPage}>Previous Page</button>
                            <span className="ms-2"></span>
                            <button className="btn btn-secondary" onClick={onNextPage}>Next Page</button>
                            <br />
                        </>
                    )}
                    <table className="table table-striped">
                        <tbody>
                            {result.map((res, index) => (
                                <tr key={res.uid}>
                                    <td>
                                        <strong>{res.alpha}</strong>
                                        <br />
                                        {res.context}

                                        <a href={res.url} target="_blank">
                                            View
                                        </a>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    
                </div>
            );
        }

        function Homepage() {
            // Search application
            const [searchTerm, setSearchTerm] = React.useState("");

            // track results
            const [searchResults, setSearchResults] = React.useState([]);
            // track full response object data
            const [data, setData] = React.useState(null);

            function performSearch(page = 1) {
                const encodedQuery = encodeURIComponent(searchTerm.trim());
                const searchUrl = `https://www.cdn.miami.edu/_assets-common/php/searchblox/?q=${encodedQuery}&page=${page}`;

                fetch(searchUrl)
                    .then((response) => response.json())
                    .then((data) => {
                        console.log("Search results: ", data);
                        setData(data); // store full payload in data state
                        setSearchResults(data.result || []);
                        // You can also update the state with the search results here
                    })
                    .catch((error) => {
                        console.error("Error performing search: ", error);
                    });
            }

            function handleNextPage() {
                if (!data?.currentPage) {
                    return;
                }
                const nextPage = data.currentPage + 1;
                performSearch(nextPage);
            }

            function handlePreviousPage() {
                if (!data?.currentPage || data.currentPage <= 1) {
                    return;
                }
                const previousPage = data.currentPage - 1;
                performSearch(previousPage);
            }

            return (
                <>
                    <Header title="Welcome to the search page" />
                    <Paragraph
                        text="Enter a search term below."
                    />
                    <br />
                    <div className="mb-3">
                        <label htmlFor="search">Search: </label>
                        <input
                            className="form-control"
                            type="text"
                            id="search"
                            name="search"
                            placeholder="Search miami.edu..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                    <button className="btn btn-primary" onClick={() => performSearch(1)}>
                        Search
                    </button>
                    <Results result={searchResults} data={data} onNextPage={handleNextPage} onPreviousPage={handlePreviousPage} />
                </>
            );
        }

        const root = ReactDOM.createRoot(app);
        root.render(<Homepage />);
    </script>
</body>

</html>
