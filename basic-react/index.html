<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Link to the react library from unpkg.com -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Link to the Babel library from unpkg.com -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <!-- Important React concepts: Components, Props, State -->
    <div id="app"></div>
    <script type="text/babel">
        const app = document.getElementById("app");

        // React Components
        function Header({ title }) {
            return <h1> {createTitle(title)} </h1>;
        }
        function createTitle(title) {
            if (title) {
                return title;
            } else {
                return "Default title";
            }
        }

        function Results({ results }) {
            const [searchResults, setSearchResults] = React.useState(results);

            return (
                <>
                    <h2>Search Results</h2>
                    <ul>
                        {results.map((result, index) => (
                            <li key={index}>
                                {result.alpha} <br />
                                {result.context} <br />
                                <a href={result.url} target="_blank">
                                    {result.title}
                                </a>
                            </li>
                        ))}
                    </ul>
                </>
            );
        }




        function Homepage() {

            // https:/www.cdn.miami.edu/_assets-common/php/searchblox/?
            const [likes, setLikes] = React.useState(0);
            const [name, setName] = React.useState('John Doe');

            //search applicatin 
            const [searchTerm, setSearchTerm] = React.useState('');


            function handleClick() {
                setLikes(likes + 1);
                console.log("Button clicked!");
                console.log("Likes: ", likes + 1);
            }

            const fruits = ["Apple", "Banana", "Cherry"];


            function performSearch() {
                console.log("Searching for: ", searchTerm);
                // Here you would typically make an API call to perform the search
                const searchUrl = `https://www.cdn.miami.edu/_assets-common/php/searchblox/?q=${encodeURIComponent(searchTerm)}`;
                fetch(searchUrl)
                    .then(response => response.json())
                    .then(data => {
                        console.log("Search results: ", data);
                        // Handle the search results here
                    })
                    .catch(error => {
                        console.error("Error performing search: ", error);
                    });
            }

            return (
                <>
                    <Header title="Welcome to the homepage" />
                    <Header />
                    <p>This is the homepage</p>

                    {fruits.map((fruit, index) => (
                        <p key={index}>{fruit}</p>
                    ))}
                    <label htmlFor="name">Name</label>
                    <input type="text" id="name" value={name} onChange={(e) => setName(e.target.value)} />
                    <p>You entered: {name}</p>
                    <button onClick={handleClick}>
                        likes: ({likes})
                    </button>



                    <input
                        type="text"
                        id="search"
                        name="search"
                        placeholder="Search..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                    />
                    <button onClick={performSearch}>Search</button>

                </>
            );
        }

        const root = ReactDOM.createRoot(app);
        root.render(<Homepage />);
    </script>
</body>

</html>
